
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Operator - Kec. Kraton</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .nav-gradient { background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 100%); }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 pb-12">
    <!-- Navbar -->
    <nav class="nav-gradient text-white p-6 shadow-lg">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row md:justify-between md:items-center">
            <div>
                <h1 class="text-xl font-bold tracking-tight uppercase">Portal Operator Madrasah</h1>
                <p class="text-blue-100 text-xs uppercase tracking-widest">Kecamatan Kraton</p>
            </div>
            <div class="mt-4 md:mt-0 text-xs bg-white/20 px-3 py-1 rounded-full backdrop-blur-sm">Sistem Terpadu</div>
        </div>
    </nav>

    <!-- Content -->
    <main class="max-w-5xl mx-auto p-4 md:p-8 space-y-8">
        
        <!-- Announcement Section -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
            <h2 class="flex items-center text-lg font-semibold text-blue-900 mb-3 uppercase tracking-tight">
                <span class="mr-2 text-2xl">📢</span> Pengumuman
            </h2>
            <p id="announcement-text" class="text-gray-600 leading-relaxed"></p>
        </div>

        <!-- Links Grid -->
        <div id="categories" class="grid md:grid-cols-3 gap-6"></div>
    </main>

    <footer class="max-w-5xl mx-auto text-center text-gray-400 text-[10px] mt-12 uppercase tracking-widest">
        Dinas Pendidikan & Kemenag - Kecamatan Kraton
    </footer>

    <script src="data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('announcement-text').innerText = portalData.announcement;
            const container = document.getElementById('categories');
            const cats = [...new Set(portalData.links.map(l => l.category))];
            
            cats.forEach(cat => {
                const section = document.createElement('div');
                section.className = "bg-white p-6 rounded-2xl shadow-sm border border-gray-200 hover:shadow-md transition-shadow";
                section.innerHTML = `<h3 class="text-blue-700 font-bold mb-4 border-b border-gray-100 pb-2 uppercase tracking-tighter">${cat}</h3>`;
                
                const list = document.createElement('ul');
                list.className = "space-y-3";
                
                portalData.links.filter(l => l.category === cat).forEach(l => {
                    list.innerHTML += `<li><a href="${l.url}" target="_blank" class="text-sm text-gray-700 hover:text-blue-700 font-medium transition flex items-center">
                        <span class="mr-2 text-blue-400">•</span> ${l.name}
                    </a></li>`;
                });
                section.appendChild(list);
                container.appendChild(section);
            });
        });
    </script>
</body>
</html>
