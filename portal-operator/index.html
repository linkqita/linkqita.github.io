
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Portal Admin Kraton</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-2xl w-full max-w-sm border border-slate-700 text-center">
            <h2 class="text-2xl font-bold mb-6 text-emerald-400">Portal Kraton</h2>
            <input type="password" id="passInput" placeholder="Masukkan Password" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl mb-4 text-center">
            <button onclick="checkAuth()" class="w-full py-3 bg-emerald-600 rounded-xl font-bold hover:bg-emerald-500">Masuk</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden p-4 max-w-4xl mx-auto">
        <div id="announcement" class="bg-emerald-900/30 border border-emerald-500/30 p-4 rounded-xl mb-6 text-sm text-emerald-300"></div>
        <div id="linkGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        <button id="adminBtn" class="mt-8 text-slate-500 text-xs hidden" onclick="goAdmin()">Admin Panel</button>
    </div>

    <script src="data.js"></script>
    <script>
        const PASS_OP = "Kraton2026";
        const PASS_ADM = "Sate123";

        function checkAuth() {
            const p = document.getElementById('passInput').value;
            if(p === PASS_OP || p === PASS_ADM) {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                if(p === PASS_ADM) document.getElementById('adminBtn').classList.remove('hidden');
                init();
            } else alert("Password Salah!");
        }

        function init() {
            document.getElementById('announcement').innerText = portalData.announcement;
            const grid = document.getElementById('linkGrid');
            portalData.links.forEach(l => {
                const card = document.createElement('div');
                card.className = "bg-slate-800 p-4 rounded-2xl border border-slate-700 hover:border-emerald-500 cursor-pointer transition";
                card.onclick = () => window.open(l.url, '_blank');
                card.innerHTML = `<p class='font-semibold text-sm'>${l.name}</p>`;
                grid.appendChild(card);
            });
        }
        function goAdmin() { window.location.href = 'admin.html'; }
    </script>
</body>
</html>
