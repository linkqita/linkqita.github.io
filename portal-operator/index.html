
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Resmi Operator Madrasah - Kraton</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .portal-header { background: #1e3a8a; }
        .instansi-nav { background: #0f172a; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <nav class="instansi-nav p-3 text-white text-center text-xs font-semibold tracking-widest">KANTOR KECAMATAN KRATON</nav>
    <header class="portal-header text-white p-6 md:p-10 text-center shadow-lg">
        <h1 class="text-2xl md:text-3xl font-bold">PORTAL OPERATOR MADRASAH</h1>
        <p class="text-blue-200 mt-2 text-sm italic">Satu Pintu Layanan Pendataan & Verval</p>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
        <!-- Pengumuman & Info -->
        <div class="grid md:grid-cols-3 gap-6">
            <section id="announcement" class="md:col-span-2 bg-amber-50 border border-amber-200 p-5 rounded-lg shadow-sm">
                <h2 class="font-bold text-amber-900 mb-2 border-b border-amber-300 pb-1">📢 PENGUMUMAN PENTING</h2>
                <p id="announcement-text" class="text-sm text-amber-800"></p>
            </section>
            <section class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                <h2 class="font-bold text-blue-900 mb-2 border-b border-blue-200 pb-1">ℹ️ INFO TERKINI</h2>
                <ul class="text-xs text-gray-600 space-y-2 list-disc pl-4">
                    <li>Sinkronisasi EMIS setiap pukul 15.00 WIB.</li>
                    <li>Pastikan cache browser selalu dibersihkan.</li>
                </ul>
            </section>
        </div>
        
        <!-- Link Categories -->
        <div id="categories" class="grid md:grid-cols-2 gap-6"></div>
    </main>

    <footer class="text-center p-8 text-gray-400 text-xs">
        &copy; 2026 Operator Madrasah - Kecamatan Kraton
    </footer>

    <script src="data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('announcement-text').innerText = portalData.announcement;
            const container = document.getElementById('categories');
            const cats = [...new Set(portalData.links.map(l => l.category))];
            
            cats.forEach(cat => {
                const section = document.createElement('div');
                section.className = "bg-white p-6 rounded-lg border border-gray-200 shadow-sm";
                section.innerHTML = `<h3 class="font-bold text-blue-900 mb-4 uppercase tracking-tighter">${cat}</h3>`;
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 gap-2";
                
                portalData.links.filter(l => l.category === cat).forEach(l => {
                    grid.innerHTML += `<a href="${l.url}" target="_blank" class="block p-3 border border-gray-100 rounded hover:bg-blue-50 hover:border-blue-200 text-sm font-medium text-gray-700 transition">‣ ${l.name}</a>`;
                });
                section.appendChild(grid);
                container.appendChild(section);
            });
        });
    </script>
</body>
</html>
