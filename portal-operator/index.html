
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Operator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f5f5f7; color: #1d1d1f; }
        .apple-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-4 md:p-12">
    <main class="max-w-4xl mx-auto">
        <header class="mb-12">
            <h1 class="text-4xl md:text-5xl font-semibold tracking-tighter mb-2">Portal Operator</h1>
            <p class="text-gray-500 text-lg">Kecamatan Kraton - Terintegrasi</p>
        </header>

        <section class="apple-card p-6 md:p-8 rounded-3xl mb-8 shadow-sm">
            <h2 class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-4">Pengumuman</h2>
            <p id="announcement-text" class="text-xl font-medium leading-snug"></p>
        </section>

        <div id="categories" class="grid md:grid-cols-2 gap-6"></div>
    </main>

    <script src="data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('announcement-text').innerText = portalData.announcement;
            const container = document.getElementById('categories');
            const cats = [...new Set(portalData.links.map(l => l.category))];
            
            cats.forEach(cat => {
                const section = document.createElement('div');
                section.className = "apple-card p-6 rounded-3xl";
                section.innerHTML = `<h3 class="font-semibold text-sm text-gray-500 mb-4 uppercase tracking-widest">${cat}</h3>`;
                
                portalData.links.filter(l => l.category === cat).forEach(l => {
                    section.innerHTML += `
                        <a href="${l.url}" target="_blank" class="flex items-center justify-between p-4 mb-2 rounded-2xl hover:bg-gray-100 transition-colors group">
                            <span class="font-medium">${l.name}</span>
                            <span class="text-gray-300 group-hover:text-black">→</span>
                        </a>`;
                });
                container.appendChild(section);
            });
        });
    </script>
</body>
</html>
